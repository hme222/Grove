<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grove: no-scroll options, round 2</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#11190a;color:var(--grove-cream);font-family:var(--font-ui);font-size:16px}
h1{font-family:var(--font-display);font-size:30px;margin:24px 24px 4px}h2{font-family:var(--font-display);font-size:26px;margin:36px 24px 2px}
.sub{margin:0 24px 14px;color:var(--grove-sage);max-width:70ch}.row{display:flex;gap:22px;padding:0 24px;flex-wrap:wrap}
.opt{width:260px}.opt h3{margin:0 0 4px;font-size:16px}.opt p{margin:6px 0 0;color:var(--grove-sage)}
.box{width:260px;height:563px;overflow:hidden;border-radius:22px;border:1px solid var(--grove-moss);position:relative}
.ph{width:390px;height:844px;transform:scale(.667);transform-origin:0 0;background:var(--grove-forest);position:relative;overflow:hidden}
.ph img{display:block}.b{padding:12px 16px}.g{display:grid;gap:10px}
.nav{position:absolute;left:0;right:0;bottom:0}
.card{background:var(--grove-canopy);border:1px solid var(--grove-moss);border-radius:20px;padding:14px}.card.m{background:var(--grove-moss)}
.btn{height:44px;border-radius:12px;border:1px solid var(--grove-fern-line);background:var(--grove-canopy);display:inline-flex;align-items:center;justify-content:center;padding:0 14px}.btn.p{background:var(--grove-lime);color:var(--grove-root);border-color:var(--grove-lime)}
.nm{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.2}.mu{color:var(--grove-sage)}.lat{font-style:italic;color:var(--grove-sage)}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;border-radius:99px;border:1px solid var(--grove-fern-line);padding:0 14px;margin:0 6px 8px 0;background:var(--grove-moss)}.chip.on{background:var(--grove-lime);color:var(--grove-root);border-color:var(--grove-lime)}
.tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--grove-moss);overflow:hidden}.tab{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:99px;border:1px solid var(--grove-moss);white-space:nowrap}.tab.on{background:var(--grove-lime);color:var(--grove-root);border-color:var(--grove-lime)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:8px;height:8px;border-radius:9px;background:var(--grove-fern-line)}.dots i.on{background:var(--grove-lime);width:22px}
.thumb{width:56px;height:56px;border-radius:12px;background:url(/p1.jpg) center/cover;flex:none}.img{background:url(/p1.jpg) center/cover}
.scrim{position:absolute;inset:0;background:rgba(10,14,6,.62)}.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--grove-forest);border:1px solid var(--grove-moss);border-radius:24px 24px 0 0;padding:16px 16px 22px}
.cream{background:#F4F1E6;color:#202D14;border:1px solid #d9d3bd;border-radius:16px}
.paw{display:inline-flex;gap:6px;border:1px solid #E57A9C;color:#E57A9C;border-radius:99px;padding:2px 10px;font-size:16px}
.arrow{width:44px;height:44px;border-radius:99px;border:1px solid var(--grove-fern-line);display:inline-flex;align-items:center;justify-content:center}
.back{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--grove-moss)}
</style></head><body>
<h1>Round 2: real UI, more options</h1>
<p class="sub">Pieces marked real come from screenshots of the current app, so spacing and type match. Pick a letter or number for each page. Already decided: Lesson card C, Progress B.</p>
<div id="root"></div>
<script>
const I=(n,s='')=>`<img src="/parts/${n}.png" style="width:100%;${s}">`;
const HDR=(n)=>`<img src="/parts/${n}.png" style="width:390px;height:117px">`;
const NAV=`<img class="nav" src="/parts/nav.png" style="width:390px">`;
const strip=(t,btn)=>`<div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="color:var(--grove-sprout)">Up next</div><div class="nm">${t}</div></div><span class="btn p">${btn}</span></div>`;
const rem=`<div class="card" style="display:flex;align-items:center;gap:10px"><span style="flex:1">One reminder a day, only when needed</span><span class="btn p" style="padding:0 12px">Yes</span><span class="btn" style="padding:0 12px">No</span></div>`;
const S=[
['Today','Real cards. The goal is plant, next lesson and the reminder question on one screen without crowding.',[
 ['T1. Reminder as a sheet','Reminder question opens once after the first care log; Today keeps search, plant, next lesson.',HDR('header-today')+`<div class="b g">${I('today-search')}${I('plantcard')}${I('pipnote')}</div><div class="scrim" style="bottom:78px"></div><div class="sheet" style="bottom:78px"><div class="nm">One reminder a day, only when needed</div><p class="mu" style="margin:6px 0 12px">We send a single message when plants need a check.</p><div style="display:flex;gap:10px"><span class="btn p" style="flex:1">Sounds good</span><span class="btn" style="flex:1">Turn off</span></div></div>`+NAV],
 ['T2. Slim banner on top','One-line reminder banner under the header, search moves into the header area as an icon row.',HDR('header-today')+`<div class="b g" style="gap:10px">${rem}${I('plantcard')}${I('pipnote')}</div>`+NAV],
 ['T3. Two small tiles','Next lesson and reminder as two compact tiles side by side under the plant.',HDR('header-today')+`<div class="b g">${I('today-search')}${I('plantcard')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card"><div style="color:var(--grove-sprout)">Up next</div><div class="nm">Soil finger-test</div><span class="btn p" style="margin-top:8px;width:100%">Start</span></div><div class="card"><div style="color:var(--grove-sprout)">Reminders</div><div class="nm">One a day</div><span class="btn" style="margin-top:8px;width:100%">Change</span></div></div></div>`+NAV],
 ['T4. Lesson stuck to the plant','The plant card and the next lesson are one block; reminder is a banner.',HDR('header-today')+`<div class="b g">${rem}<div style="border-radius:20px;overflow:hidden;border:1px solid var(--grove-moss)">${I('plantcard','border-radius:0')}<div style="background:var(--grove-canopy);padding:12px 14px;display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="color:var(--grove-sprout)">Up next</div><div class="nm">Soil finger-test</div></div><span class="btn p">Start</span></div></div></div>`+NAV],
 ['T5. One plant, lesson bar at the bottom','Big plant card, a pinned “Up next” bar above the tab bar, reminder as a dismissible line.',HDR('header-today')+`<div class="b g">${I('today-search')}${I('plantcard')}<div class="card" style="display:flex;align-items:center"><span style="flex:1">One reminder a day, only when needed</span><span class="mu">✕</span></div></div><div style="position:absolute;left:12px;right:12px;bottom:90px">${strip('Soil finger-test','Start')}</div>`+NAV]]],
["Pip's nook (real room, real note)",'The room is the real pixel scene. Plants use the real cream card style.',[
 ['N1. Room, note, plants strip','Scene and note on top; your plants as one sideways row of cream cards.',HDR('header-nook')+`<div style="position:relative">${I('nook-scene')}</div><div class="b">${I('nook-note','margin-top:-26px;position:relative')}<div style="margin:10px 0 6px;font-family:var(--font-display);font-size:20px">Your plants</div><div style="display:flex;gap:10px"><div class="cream" style="width:150px;padding:8px"><div style="height:60px;border-radius:10px;background:#EBE3D2;display:flex;align-items:center;justify-content:center">🍃</div><div class="nm" style="font-size:18px;margin-top:6px">Sammy</div><div>◌ No checks yet</div></div><div class="cream" style="width:150px;padding:8px;opacity:.55;display:flex;align-items:center;justify-content:center">+ Add</div></div></div>`+NAV],
 ['N2. Tabs: Room | Plants','Room tab is the scene, note and status. Plants tab holds the cream cards.',HDR('header-nook')+`<div class="tabs" style="border:0"><span class="tab on">🏡 Room</span><span class="tab">🪴 Plants</span></div>${I('nook-scene')}<div class="b">${I('nook-note','margin-top:-26px;position:relative')}<div class="mu" style="margin-top:10px">Bare · Next in your nook: the shelf.</div><div class="mu">In the nook: Sammy on the table.</div></div>`+NAV],
 ['N3. Short room, compact plant row','A cropped band of the real room, the note, one plant as a wide cream row.',HDR('header-nook')+`<div style="height:120px;overflow:hidden">${I('nook-scene','margin-top:-70px')}</div><div class="b">${I('nook-note')}<div style="margin:10px 0 6px;font-family:var(--font-display);font-size:20px">Your plants</div><div class="cream" style="display:flex;gap:12px;align-items:center;padding:10px"><div style="width:56px;height:56px;border-radius:10px;background:#EBE3D2;display:flex;align-items:center;justify-content:center">🍃</div><div style="flex:1"><div class="nm" style="font-size:18px">Sammy</div><div>◌ No checks yet</div></div><span class="btn" style="background:#fff;color:#202D14">Looks off</span></div></div>`+NAV]]],
['Plant detail: tabs with emoji','Tabs from option A, now with emoji. Three ways to place them.',[
 ['P1. Emoji left of the label','💧 Care · 📓 Journal · 📷 Photos · 🌿 About.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Monstera</b><span></span></div><div class="img" style="height:190px"></div><div class="b"><div class="nm" style="font-size:24px">Spider Plant</div><div class="lat" style="margin-bottom:8px">Chlorophytum comosum</div><span class="chip on">✅ Healthy</span><span class="chip">🐾 Pet safe</span></div><div class="tabs"><span class="tab on">💧 Care</span><span class="tab">📓 Journal</span><span class="tab">📷 Photos</span></div><div class="b"><div class="card m">Check about every 7 days<br><span class="mu">Medium · Soil</span></div><span class="btn p" style="width:100%;margin-top:10px">💧 Log care</span></div>`],
 ['P2. Emoji above the label','Bigger tap targets; four equal tabs.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Monstera</b><span></span></div><div class="img" style="height:190px"></div><div class="b"><div class="nm" style="font-size:24px">Spider Plant</div><div class="lat" style="margin-bottom:8px">Chlorophytum comosum</div><span class="chip on">✅ Healthy</span><span class="chip">🐾 Pet safe</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--grove-moss)"><div style="text-align:center;padding:8px 0;border-bottom:3px solid var(--grove-lime)">💧<br>Care</div><div style="text-align:center;padding:8px 0" class="mu">📓<br>Journal</div><div style="text-align:center;padding:8px 0" class="mu">📷<br>Photos</div><div style="text-align:center;padding:8px 0" class="mu">🌿<br>About</div></div><div class="b"><div class="card m">Check about every 7 days<br><span class="mu">Medium · Soil</span></div><span class="btn p" style="width:100%;margin-top:10px">💧 Log care</span></div>`],
 ['P3. Emoji only until selected','Compact: emoji pills, the selected one adds its label.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Monstera</b><span></span></div><div class="img" style="height:190px"></div><div class="b"><div class="nm" style="font-size:24px">Spider Plant</div><div class="lat" style="margin-bottom:8px">Chlorophytum comosum</div><span class="chip on">✅ Healthy</span><span class="chip">🐾 Pet safe</span></div><div class="tabs"><span class="tab on">💧 Care</span><span class="tab">📓</span><span class="tab">📷</span><span class="tab">🌿</span></div><div class="b"><div class="card m">Check about every 7 days<br><span class="mu">Medium · Soil</span></div><span class="btn p" style="width:100%;margin-top:10px">💧 Log care</span></div>`]]],
['Plant guide species: photo on top, tiles on the same page','Tiles stay on this page; no extra screen opens.',[
 ['G1. Tiles open one panel below','Tap a tile and its text appears under the grid. One open at a time.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Monstera</b><span></span></div><div class="img" style="height:180px"></div><div class="b"><div class="lat" style="margin-bottom:8px">Monstera deliciosa · <span class="paw">⚠ Toxic</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card m" style="outline:2px solid var(--grove-lime)">☀️ Light<br><span class="mu">Bright, indirect</span></div><div class="card m">💧 Water<br><span class="mu">Every 7 days</span></div><div class="card m">🌱 Soil<br><span class="mu">Well-draining</span></div><div class="card m">🐾 Pets<br><span class="mu">Toxic</span></div></div><div class="card" style="margin-top:10px"><b>☀️ Light</b><p class="mu" style="margin:6px 0 0">Bright indirect light. Keep it a few feet back from a south window.</p></div><span class="btn p" style="width:100%;margin-top:10px">Add to my plants</span></div>`],
 ['G2. Tile grows in place','The tapped tile expands to full width with its text inside; the others shrink to a row.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Monstera</b><span></span></div><div class="img" style="height:180px"></div><div class="b"><div class="lat" style="margin-bottom:8px">Monstera deliciosa · <span class="paw">⚠ Toxic</span></div><div class="card m" style="outline:2px solid var(--grove-lime)"><b>☀️ Light</b><p class="mu" style="margin:6px 0 0">Bright indirect light. Keep it a few feet back from a south window. Rotate each week.</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px"><div class="card m" style="text-align:center">💧<br>Water</div><div class="card m" style="text-align:center">🌱<br>Soil</div><div class="card m" style="text-align:center">🐾<br>Pets</div></div><span class="btn p" style="width:100%;margin-top:10px">Add to my plants</span></div>`],
 ['G3. Icon row + one panel','Four emoji pills in a row; the panel below changes.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Monstera</b><span></span></div><div class="img" style="height:180px"></div><div class="b"><div class="lat" style="margin-bottom:8px">Monstera deliciosa · <span class="paw">⚠ Toxic</span></div><div style="display:flex;gap:8px"><span class="tab on">☀️ Light</span><span class="tab">💧</span><span class="tab">🌱</span><span class="tab">🐾</span></div><div class="card m" style="margin-top:10px"><b>☀️ Light</b><p class="mu" style="margin:6px 0 0">Bright indirect light. Keep it a few feet back from a south window. Rotate each week.</p></div><span class="btn p" style="width:100%;margin-top:10px">Add to my plants</span></div>`]]],
['Learn','Real Learn pieces. Five ways to fit lessons and a 40-species guide.',[
 ['L1. Slim lessons + three species','Lessons shrinks to a bar; three species with “See all 40”.',HDR('header-learn')+`<div class="b g"><div class="card" style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div class="nm">Short lessons</div><div class="mu">Water, light, soil</div></div><span>›</span></div>${I('guide-search')}${I('species-card')}${I('species-card')}<span class="btn" style="width:100%">See all 40 plants ›</span></div>`+NAV],
 ['L2. Segments: Lessons | Plant guide','One segmented switch; each side fits on its own.',HDR('header-learn')+`<div class="tabs" style="border:0"><span class="tab on">📚 Lessons</span><span class="tab">🪴 Plant guide</span></div><div class="b g">${I('lessons-card')}<div class="card"><div class="nm">Soil finger-test</div><div class="mu">Up next · 3 min</div></div><div class="card"><div class="nm">Plant parent reset</div><div class="mu">After that</div></div></div>`+NAV],
 ['L3. Sideways rows','A row of lesson cards and a row of species tiles that swipe.',HDR('header-learn')+`<div class="b"><div class="nm" style="margin-bottom:8px">Lessons</div><div style="display:flex;gap:10px;overflow:hidden"><div class="card m" style="width:230px;flex:none"><div class="nm">Soil finger-test</div><div class="mu">3 min</div></div><div class="card m" style="width:230px;flex:none"><div class="nm">Plant parent reset</div><div class="mu">4 min</div></div></div><div class="nm" style="margin:18px 0 8px">Plant guide · 40</div><div style="display:flex;gap:10px;overflow:hidden">${['Monstera','Pothos','Snake Plant'].map(x=>`<div class="card" style="width:150px;flex:none;padding:8px"><div class="thumb" style="width:100%;height:100px"></div><div class="nm" style="font-size:18px;margin-top:6px">${x}</div><span class="paw" style="margin-top:4px">⚠ Toxic</span></div>`).join('')}</div></div>`+NAV],
 ['L4. Search first, filters, one featured','Big search, filter chips, a featured plant, lessons as a bar.',HDR('header-learn')+`<div class="b g">${I('guide-search')}<div><span class="chip on">All</span><span class="chip">🐾 Pet safe</span><span class="chip">🌤 Low light</span><span class="chip">🌱 Easy</span></div>${I('species-card')}<div class="card" style="display:flex;align-items:center"><span style="flex:1">📚 Short lessons</span><span>›</span></div></div>`+NAV],
 ['L5. Photo tile grid','Species as a two-column photo grid, lessons as a banner on top.',HDR('header-learn')+`<div class="b g"><div class="card" style="display:flex;align-items:center"><span style="flex:1">📚 Short lessons: water, light, soil</span><span>›</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${['Monstera','Pothos','Snake Plant','Spider Plant','Peace Lily','Aloe'].map(x=>`<div class="card" style="padding:6px"><div class="thumb" style="width:100%;height:78px"></div><div class="nm" style="font-size:17px;margin-top:4px">${x}</div></div>`).join('')}</div></div>`+NAV]]],
['Lessons','Real “Up next” hero where it appears. Five ways to show the whole list.',[
 ['Z1. Compact hero + list','A shorter Up next card, then four lesson rows with minutes and status.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Lessons</b><span></span></div><div class="b g"><div class="card m" style="display:flex;gap:12px"><div class="thumb" style="width:90px;height:90px"></div><div><div class="mu">Up next</div><div class="nm">Soil finger-test</div><span class="btn p" style="margin-top:8px">Start lesson</span></div></div>${[['Plant parent reset','4 min'],['Plant ER','5 min'],['Your spot’s light','3 min'],['Your window','3 min']].map(x=>`<div class="card" style="display:flex;justify-content:space-between"><span>${x[0]}</span><span class="mu">${x[1]}</span></div>`).join('')}</div>`+NAV],
 ['Z2. Path of steps','Lessons as a vertical path; the current one expands.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Lessons</b><span></span></div><div class="b"><div style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;align-items:center"><div style="width:26px;height:26px;border-radius:99px;background:var(--grove-lime);color:var(--grove-root);text-align:center">1</div><div style="flex:1;width:2px;background:var(--grove-fern-line)"></div></div><div class="card m" style="flex:1;margin-bottom:10px"><div class="nm">Soil finger-test</div><div class="mu">Check the soil with your finger, then decide.</div><span class="btn p" style="margin-top:8px">Start lesson</span></div></div>${['Plant parent reset','Plant ER','Your spot’s light'].map((x,i)=>`<div style="display:flex;gap:12px;margin-bottom:10px"><div style="width:26px;height:26px;border-radius:99px;border:1px solid var(--grove-fern-line);text-align:center">${i+2}</div><div class="card" style="flex:1">${x}</div></div>`).join('')}</div>`+NAV],
 ['Z3. Tile grid','Up next as a wide tile, the rest as a 2 × 2 grid with photos.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Lessons</b><span></span></div><div class="b g"><div class="card m" style="padding:0;overflow:hidden"><div class="img" style="height:120px"></div><div style="padding:12px 14px;display:flex;align-items:center;gap:10px"><div style="flex:1"><div class="mu">Up next</div><div class="nm">Soil finger-test</div></div><span class="btn p">Start</span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${['Plant parent reset','Plant ER','Your spot’s light','Your window'].map(x=>`<div class="card" style="padding:8px"><div class="thumb" style="width:100%;height:70px"></div><div style="margin-top:6px">${x}</div></div>`).join('')}</div></div>`+NAV],
 ['Z4. Hero + accordion','Real hero image shrunk; “All lessons (6)” opens a list in place.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Lessons</b><span></span></div><div class="b g">${I('lesson-hero','border-radius:20px;height:260px;object-fit:cover')}<div class="card" style="display:flex;justify-content:space-between"><span>After that: Plant parent reset</span></div><div class="card"><div style="display:flex;justify-content:space-between"><b>All lessons (6)</b><span>⌄</span></div><div class="mu" style="margin-top:8px">Plant ER · Habit stacking · Your spot’s light · Your window</div></div></div>`+NAV],
 ['Z5. Segments: Up next | All | Done','Up next shows the hero; All shows rows; Done shows what you finished.',`<div class="back"><span>‹ Back</span><b style="font-family:var(--font-display);font-size:22px">Lessons</b><span></span></div><div class="tabs" style="border:0"><span class="tab on">▶ Up next</span><span class="tab">📚 All</span><span class="tab">✅ Done</span></div><div class="b">${I('lesson-hero','border-radius:20px')}<div class="mu" style="margin-top:10px">After that: Plant parent reset</div></div>`+NAV]]]
];
document.getElementById('root').innerHTML=S.map(s=>`<h2>${s[0]}</h2><p class="sub">${s[1]}</p><div class="row">${s[2].map(o=>`<div class="opt"><h3>${o[0]}</h3><div class="box"><div class="ph">${o[2]}</div></div><p>${o[1]}</p></div>`).join('')}</div>`).join('');
</script></body></html>

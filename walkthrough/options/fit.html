<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grove: no-scroll options</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#11190a;color:var(--grove-cream);font-family:var(--font-ui);font-size:16px}
h1{font-family:var(--font-display);font-size:30px;margin:24px 24px 4px}h2{font-family:var(--font-display);font-size:26px;margin:34px 24px 2px}
.sub{margin:0 24px 14px;color:var(--grove-sage)}.row{display:flex;gap:22px;padding:0 24px;flex-wrap:wrap}
.opt{width:260px}.opt h3{margin:0 0 4px;font-size:16px}.opt p{margin:6px 0 0;color:var(--grove-sage);font-size:16px}
.box{width:260px;height:535px;overflow:hidden;border-radius:22px;border:1px solid var(--grove-moss);position:relative}
.ph{width:390px;height:844px;transform:scale(.667);transform-origin:0 0;background:var(--grove-forest);position:relative;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--grove-moss)}.hd b{font-family:var(--font-display);font-size:26px;font-weight:600}
.pl{height:44px;border-radius:99px;border:1px solid var(--grove-moss);background:var(--grove-canopy);display:inline-flex;align-items:center;justify-content:center;padding:0 14px;margin-left:6px}.pl.i{width:44px;padding:0}
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:1px solid var(--grove-moss);background:var(--grove-forest);display:flex;justify-content:space-around;align-items:center;color:var(--grove-sage)}.nav b{color:var(--grove-cream)}
.b{padding:14px 16px}.card{background:var(--grove-canopy);border:1px solid var(--grove-moss);border-radius:20px;padding:14px}.card.m{background:var(--grove-moss)}
.btn{height:44px;border-radius:12px;border:1px solid var(--grove-fern-line);background:var(--grove-canopy);display:inline-flex;align-items:center;padding:0 14px;justify-content:center}.btn.p{background:var(--grove-lime);color:var(--grove-root);border-color:var(--grove-lime)}
.nm{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.2}.mu{color:var(--grove-sage)}.lat{font-style:italic;color:var(--grove-sage)}
.chip{display:inline-flex;align-items:center;height:40px;border-radius:99px;border:1px solid var(--grove-fern-line);padding:0 14px;margin:0 6px 8px 0;background:var(--grove-moss)}
.tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--grove-moss)}.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--grove-moss)}.tab.on{background:var(--grove-lime);color:var(--grove-root);border-color:var(--grove-lime)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:8px;height:8px;border-radius:9px;background:var(--grove-fern-line)}.dots i.on{background:var(--grove-lime);width:22px}
.img{background:url(/p1.jpg) center/cover;border-radius:14px}.thumb{width:56px;height:56px;border-radius:12px;background:url(/p1.jpg) center/cover;flex:none}
.scrim{position:absolute;inset:0;background:rgba(10,14,6,.62)}.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--grove-forest);border:1px solid var(--grove-moss);border-radius:24px 24px 0 0;padding:14px 16px 20px}
.arrow{width:44px;height:44px;border-radius:99px;border:1px solid var(--grove-fern-line);display:inline-flex;align-items:center;justify-content:center}
</style></head><body>
<h1>Making every demo page fit one screen</h1>
<p class="sub">Three options per page. Each frame is a 390 × 844 phone shown at about two thirds size. Say which letter you want for each page (for example Today B, Lesson A).</p>
<div id="root"></div>
<script>
const H=(t,on)=>`<div class="hd"><b>${t}</b><span><span class="pl">Plant help</span><span class="pl i">🔔</span><span class="pl i">👤</span></span></div>`;
const NAV=(a)=>`<div class="nav">${['Today','Plants','Learn'].map(x=>x===a?`<b>${x}</b>`:`<span>${x}</span>`).join('')}</div>`;
const plantCard=`<div class="card m" style="display:flex;gap:12px"><div class="thumb" style="width:72px;height:72px"></div><div style="flex:1"><div class="nm">Spider Plant</div><div class="mu">No checks yet</div><div class="lat">Chlorophytum comosum</div></div></div><div style="display:flex;gap:10px;margin:10px 0"><span class="btn p" style="flex:1">Check the soil</span><span class="btn" style="flex:1">Watered</span></div>`;
const lesson=`<div class="card"><div style="color:var(--grove-sprout)">YOUR NEXT LESSON</div><div class="nm">Soil finger-test</div><div class="mu">Check the soil with your finger, then decide.</div><div style="display:flex;justify-content:space-between;margin-top:8px;align-items:center"><span style="text-decoration:underline">All lessons</span><span class="btn p">Start</span></div></div>`;
const S=[
['Today','The one-time reminder question is what pushes Today over by about 150 px.',[
 ['A. Question as a bottom sheet','The reminder question opens as a sheet after the first care log, then never again. Today is just plants plus the next lesson.',H('Today')+`<div class="tabs"><span class="tab on">To do</span><span class="tab">Progress</span></div><div class="b"><div class="card m" style="margin-bottom:12px;color:var(--grove-sage)">🔍 Search plants, guides and lessons</div>${plantCard}<div class="nm" style="margin:6px 0 8px">For today</div>${lesson}</div><div class="scrim"></div><div class="sheet"><div class="nm">One reminder a day, only when needed</div><p class="mu" style="margin:6px 0 12px">We send one message when plants need a check.</p><div style="display:flex;gap:10px"><span class="btn p" style="flex:1">Sounds good</span><span class="btn" style="flex:1">Turn off</span></div></div>`+NAV('Today')],
 ['B. One compact row','The question becomes one line with two small buttons inside the plant card area.',H('Today')+`<div class="tabs"><span class="tab on">To do</span><span class="tab">Progress</span></div><div class="b"><div class="card m" style="margin-bottom:12px;color:var(--grove-sage)">🔍 Search plants, guides and lessons</div>${plantCard}<div class="card" style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="flex:1">One reminder a day?</span><span class="btn p">Yes</span><span class="btn">No</span></div>${lesson}</div>`+NAV('Today')],
 ['C. Ask during the plan screen','The reminder and pets questions move into onboarding, right after the plan. Today never shows them.',H('Today')+`<div class="tabs"><span class="tab on">To do</span><span class="tab">Progress</span></div><div class="b"><div class="card m" style="margin-bottom:12px;color:var(--grove-sage)">🔍 Search plants, guides and lessons</div>${plantCard}<div class="nm" style="margin:6px 0 8px">For today</div>${lesson}<p class="mu" style="margin-top:10px">Reminders and pets are in Profile.</p></div>`+NAV('Today')]]],
['Lesson activity card (soil test)','Two questions, five optional chips, and a submit button stack past one screen.',[
 ['A. One question per screen','Same questions, one at a time with dots. Each answer moves on.',`<div class="hd"><span>‹ Back</span><span class="mu">Card 5 of 5</span></div><div class="b"><div class="nm" style="font-size:24px;margin:6px 0 10px">What did you feel in the soil?</div><div class="card m" style="margin-bottom:10px;height:70px;display:flex;align-items:center">Dry and dusty</div><div class="card m" style="height:70px;display:flex;align-items:center">Damp and cool</div><div class="dots"><i class="on"></i><i></i><i></i></div></div>`],
 ['B. Required first, rest optional','Only the soil question shows. “Add more (optional)” opens the other two.',`<div class="hd"><span>‹ Back</span><span class="mu">Card 5 of 5</span></div><div class="b"><div class="card" style="margin-bottom:12px"><div class="nm">60 seconds. One plant.</div><p class="mu" style="margin:6px 0 0">Press a finger into the soil, then tap what you found.</p></div><div class="mu" style="margin-bottom:8px">What did you feel in the soil?</div><div style="display:flex;gap:10px;margin-bottom:12px"><span class="btn" style="flex:1;height:54px">Dry and dusty</span><span class="btn" style="flex:1;height:54px">Damp and cool</span></div><div class="card" style="display:flex;justify-content:space-between"><span>Add more (optional)</span><span>›</span></div><span class="btn p" style="width:100%;margin-top:14px">Save and finish</span></div>`],
 ['C. Intro folds away','The 60-second card shrinks to one line once you start; all questions stay on one screen, tighter.',`<div class="hd"><span>‹ Back</span><span class="mu">Card 5 of 5</span></div><div class="b"><div class="mu" style="margin-bottom:10px">⏱ 60 seconds. One plant. Real answer.</div><div class="mu">Soil feels…</div><div style="display:flex;gap:8px;margin:6px 0 12px"><span class="btn" style="flex:1">Dry</span><span class="btn" style="flex:1">Damp</span></div><div class="mu">You'll…</div><div style="display:flex;gap:8px;margin:6px 0 12px"><span class="btn" style="flex:1">Water it</span><span class="btn" style="flex:1">Wait</span></div><div class="mu">Noticed</div><div style="margin-top:6px"><span class="chip">Looked fine</span><span class="chip">Drooping</span><span class="chip">New growth</span><span class="chip">Pulling away</span><span class="chip">Pests</span></div><span class="btn p" style="width:100%">Save and finish</span></div>`]]],
["Pip's nook",'A room picture, a note, status lines, and a grid of plants.',[
 ['A. Room with a plants strip','Smaller scene, then your plants as one sideways row.',H("Pip's nook")+`<div class="tabs"><span class="tab">To do</span><span class="tab">Progress</span><span class="tab on">Pip</span></div><div class="img" style="height:200px;border-radius:0;background-color:#e4cfa8"></div><div class="b"><div class="card" style="background:var(--grove-cream);color:var(--grove-forest)">Pip's note: I'll be on the windowsill.</div><div class="mu" style="margin:10px 0">Next in your nook: the shelf</div><div class="nm" style="margin-bottom:8px">Your plants</div><div style="display:flex;gap:10px"><div class="card" style="width:130px;padding:8px"><div class="thumb" style="width:100%;height:70px"></div>Spider Plant</div><div class="card" style="width:130px;padding:8px;opacity:.5"><div style="height:70px"></div>+ Add</div></div></div>`+NAV('Today')],
 ['B. Two tabs: Room | Plants','The room fills the screen on Room; plants live on their own tab.',H("Pip's nook")+`<div class="tabs"><span class="tab on">Room</span><span class="tab">Plants</span></div><div class="img" style="height:330px;border-radius:0;background-color:#e4cfa8"></div><div class="b"><div class="card" style="background:var(--grove-cream);color:var(--grove-forest)">Pip's note: I'll be on the windowsill.</div><div class="mu" style="margin-top:10px">Next in your nook: the shelf</div></div>`+NAV('Today')],
 ['C. Room as header only','A short room banner, status line, then plants as a compact list.',H("Pip's nook")+`<div class="img" style="height:130px;border-radius:0;background-color:#e4cfa8"></div><div class="b"><div class="card" style="background:var(--grove-cream);color:var(--grove-forest);margin-bottom:10px">I'll be on the windowsill if you need me.</div><div class="mu" style="margin-bottom:8px">Next: the shelf</div><div class="card" style="display:flex;gap:12px;align-items:center"><div class="thumb"></div><div style="flex:1"><div class="nm">Spider Plant</div><div class="mu">Healthy</div></div><span class="btn">Looks off</span></div></div>`+NAV('Today')]]],
['Progress','Three stat tiles, a personality card, a watering card and a care-time card.',[
 ['A. Four small tiles','Stats as a 2 × 2 grid; personality and watering as one short card each.',H('Progress')+`<div class="tabs"><span class="tab">To do</span><span class="tab on">Progress</span></div><div class="b"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card m">1<br><span class="mu">Plant</span></div><div class="card m">0<br><span class="mu">Care logs</span></div><div class="card m">0 of 3<br><span class="mu">Check-ins</span></div><div class="card m">1 min<br><span class="mu">Care time</span></div></div><div class="card m" style="margin-top:10px"><span class="mu">Plant personality</span><div class="nm">The Fresh Start</div></div><div class="card m" style="margin-top:10px"><span class="mu">Watering</span><div class="nm">All on schedule</div></div></div>`+NAV('Today')],
 ['B. Swipe pages with dots','Stats, personality, schedule as three swipe pages.',H('Progress')+`<div class="tabs"><span class="tab">To do</span><span class="tab on">Progress</span></div><div class="b"><div class="card m" style="padding:24px"><div class="mu">Plant personality</div><div class="nm" style="font-size:30px;margin:8px 0">The Fresh Start</div><p>New plants, new chapter. You're in the getting-to-know-you phase, and that's the fun part.</p></div><div class="dots"><i class="on"></i><i></i><i></i></div><div style="display:flex;justify-content:space-between"><span class="arrow">‹</span><span class="arrow">›</span></div></div>`+NAV('Today')],
 ['C. Tabs inside the page','Stats | Personality | Schedule as chips under the page title.',H('Progress')+`<div class="tabs"><span class="tab">To do</span><span class="tab on">Progress</span></div><div class="tabs"><span class="tab on">Stats</span><span class="tab">Personality</span><span class="tab">Schedule</span></div><div class="b"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card m">1<br><span class="mu">Plant</span></div><div class="card m">0<br><span class="mu">Care logs</span></div></div><div class="card m" style="margin-top:10px">0 of 3<br><span class="mu">Check-ins this week</span></div></div>`+NAV('Today')]]],
['Plant detail','The longest page: photo, name, safety, care facts, journal, photos, about, light, watering.',[
 ['A. Tabs: Care | Journal | Photos | About','Top of the page stays; sections become tabs.',`<div class="hd"><span>‹ Back</span><b style="font-size:22px">Monstera</b><span></span></div><div class="img" style="height:190px;border-radius:0"></div><div class="b"><div class="nm" style="font-size:24px">Spider Plant</div><div class="lat" style="margin-bottom:8px">Chlorophytum comosum</div><span class="chip">Healthy</span><span class="chip">Pet safe</span></div><div class="tabs"><span class="tab on">Care</span><span class="tab">Journal</span><span class="tab">Photos</span><span class="tab">About</span></div><div class="b"><div class="card m">Check about every 7 days<br><span class="mu">Medium · Soil</span></div><span class="btn p" style="width:100%;margin-top:10px">Log care</span></div>`],
 ['B. Tiles that open sheets','Like Profile: Care, Light, Journal, Photos, About as tiles; each opens a sheet.',`<div class="hd"><span>‹ Back</span><b style="font-size:22px">Spider Plant</b><span></span></div><div class="img" style="height:150px;border-radius:0"></div><div class="b"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card m">💧 Care<br><span class="mu">Every 7 days</span></div><div class="card m">☀ Light<br><span class="mu">Bright, indirect</span></div><div class="card m">📓 Journal<br><span class="mu">1 entry</span></div><div class="card m">📷 Photos<br><span class="mu">3 photos</span></div></div><span class="btn p" style="width:100%;margin-top:12px">Log care</span></div>`],
 ['C. Swipe pages','Each section is a full-width page; swipe or tap arrows.',`<div class="hd"><span>‹ Back</span><b style="font-size:22px">Spider Plant</b><span></span></div><div class="b"><div class="card m"><div class="nm">Care</div><p class="mu">Check about every 7 days. Bright indirect light. Let the top inch of soil dry between waterings.</p><div class="img" style="height:200px"></div></div><div class="dots"><i class="on"></i><i></i><i></i><i></i></div><div style="display:flex;justify-content:space-between"><span class="arrow">‹</span><span class="btn p">Log care</span><span class="arrow">›</span></div></div>`]]],
['Plant guide species page','A long reference page for one species.',[
 ['A. Tabs','Overview | Care | Safety | Sources.',`<div class="hd"><span>‹ Back</span><b style="font-size:22px">Monstera</b><span></span></div><div class="img" style="height:170px;border-radius:0"></div><div class="tabs"><span class="tab on">Overview</span><span class="tab">Care</span><span class="tab">Safety</span><span class="tab">Sources</span></div><div class="b"><p>Monstera deliciosa. Bright indirect light; let the top inch of soil dry between waterings.</p><span class="btn p" style="width:100%">Add to my plants</span></div>`],
 ['B. Facts as tiles','Light, water, soil, safety as four tiles; each opens a sheet.',`<div class="hd"><span>‹ Back</span><b style="font-size:22px">Monstera</b><span></span></div><div class="b"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card m">☀ Light<br><span class="mu">Bright, indirect</span></div><div class="card m">💧 Water<br><span class="mu">Every 7 days</span></div><div class="card m">🌱 Soil<br><span class="mu">Well-draining</span></div><div class="card m">🐾 Pets<br><span class="mu">Toxic</span></div></div><span class="btn p" style="width:100%;margin-top:12px">Add to my plants</span></div>`],
 ['C. Swipe pages','One topic per page, with arrows and dots.',`<div class="hd"><span>‹ Back</span><b style="font-size:22px">Monstera</b><span></span></div><div class="b"><div class="card m"><div class="nm">Light</div><p class="mu">Bright indirect light. A few feet back from a south window.</p></div><div class="dots"><i class="on"></i><i></i><i></i><i></i></div><div style="display:flex;justify-content:space-between"><span class="arrow">‹</span><span class="btn p">Add to my plants</span><span class="arrow">›</span></div></div>`]]],
['Learn','Lessons card plus a 40-species list.',[
 ['A. Four species per page','Lessons card on top; species as four rows with Previous / Next.',H('Learn')+`<div class="b"><div class="card m" style="margin-bottom:10px">Short lessons ›</div>${[1,2,3,4].map(i=>`<div class="card" style="display:flex;gap:10px;margin-bottom:8px;align-items:center"><div class="thumb"></div><div><div class="nm">Species ${i}</div><div class="lat">Latin name</div></div></div>`).join('')}<div style="display:flex;justify-content:space-between"><span class="arrow">‹</span><span class="mu">1 of 10</span><span class="arrow">›</span></div></div>`+NAV('Learn')],
 ['B. Chips, then a short list','Filter chips (Pet safe, Low light, Easy) and three matches; "See all 40" opens a full page.',H('Learn')+`<div class="b"><div class="card m" style="margin-bottom:10px">Short lessons ›</div><span class="chip">Pet safe</span><span class="chip">Low light</span><span class="chip">Easy</span>${[1,2,3].map(i=>`<div class="card" style="display:flex;gap:10px;margin-bottom:8px;align-items:center"><div class="thumb"></div><div><div class="nm">Species ${i}</div><div class="lat">Latin name</div></div></div>`).join('')}<span class="btn" style="width:100%">See all 40 plants</span></div>`+NAV('Learn')],
 ['C. Two sideways rows','Lessons row and species row, each swipes sideways.',H('Learn')+`<div class="b"><div class="nm" style="margin-bottom:8px">Lessons</div><div style="display:flex;gap:10px;overflow:hidden"><div class="card m" style="width:200px;flex:none">Soil finger-test</div><div class="card m" style="width:200px;flex:none">Light</div></div><div class="nm" style="margin:16px 0 8px">Plant guide</div><div style="display:flex;gap:10px;overflow:hidden">${[1,2,3].map(i=>`<div class="card" style="width:150px;flex:none"><div class="thumb" style="width:100%;height:90px"></div>Species ${i}</div>`).join('')}</div></div>`+NAV('Learn')]]]
];
document.getElementById('root').innerHTML=S.map((s,si)=>`<h2>${s[0]}</h2><p class="sub">${s[1]}</p><div class="row">${s[2].map(o=>`<div class="opt"><h3>${o[0]}</h3><div class="box"><div class="ph">${o[2]}</div></div><p>${o[1]}</p></div>`).join('')}</div>`).join('');
</script></body></html>

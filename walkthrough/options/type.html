<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grove: type check (trial fonts, local only)</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/tokens.css">
<style>
@font-face{font-family:'T-Fenul';src:url('/fonts/trial/fenul.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'T-Reckless';src:url('/fonts/trial/reckless.woff2') format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:'T-Reckless';src:url('/fonts/trial/reckless-italic.woff2') format('woff2');font-weight:100 900;font-style:italic}
@font-face{font-family:'T-Serrif';src:url('/fonts/trial/serrif.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'T-Tobias';src:url('/fonts/trial/tobias.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'T-Teodor';src:url('/fonts/trial/teodor.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#11190a;color:var(--grove-cream);font-family:var(--font-ui);font-size:16px}
h1{font-family:var(--font-display);font-size:30px;margin:24px 24px 4px}.sub{margin:0 24px 14px;color:var(--grove-sage);max-width:70ch}
.row{display:flex;gap:22px;padding:0 24px 40px;flex-wrap:wrap}.col{width:330px}.col h3{margin:0 0 8px;font-size:16px}
.ph{background:var(--grove-forest);border:1px solid var(--grove-moss);border-radius:28px;padding:20px}
.card{background:var(--grove-moss);border:1px solid var(--grove-fern-line);border-radius:20px;padding:16px;margin-top:14px}
.d{font-weight:600}.w{font-size:30px;line-height:1.1}.h{font-size:24px;margin:0 0 8px}.s{font-size:20px}.sm{font-size:16px}
.f-cur .d{font-family:var(--font-display)}.f-fen .d{font-family:'T-Fenul'}.f-rec .d{font-family:'T-Reckless'}.f-ser .d{font-family:'T-Serrif'}.f-tob .d{font-family:'T-Tobias'}.f-teo .d{font-family:'T-Teodor'}
.b{font-family:var(--font-ui)}.it{font-style:italic}
</style></head><body>
<h1>Type check: headings in trial fonts</h1>
<p class="sub">Trial fonts, on this computer only (the trial license is for internal testing, so they are not in git and not deployed). Body text stays Alegreya Sans in every column; only headings change.</p>
<div class="row" id="r"></div>
<script>
const C=[['f-cur','Now: Cormorant Garamond'],['f-fen','Fenul'],['f-rec','Reckless'],['f-ser','Serrif'],['f-tob','Tobias'],['f-teo','Teodor']];
document.getElementById('r').innerHTML=C.map(([c,t])=>`<div class="col ${c}"><h3>${t}</h3><div class="ph"><div class="d w">Welcome to FloraGrove</div><div class="card"><div class="d h">Erase the plant guilt.</div><div class="b sm">Most plants don’t die from a lack of love. They die from drowning. Throw away any rigid watering schedule.</div></div><div class="card"><div class="d s">Spider Plant</div><div class="b sm it">Chlorophytum comosum</div><div class="b sm">Check about every 7 days</div></div><div class="card"><div class="d sm" style="font-size:18px">One reminder a day, only when needed</div><div class="b sm">We send a single message when plants need a check.</div></div><div class="d s" style="margin-top:16px">Your plants · 1 2 3 4 5 6 7 8 9</div></div></div>`).join('');
</script></body></html>

# Render Blueprint for the Grove API (grove-backend). The frontend and landing page deploy on Vercel.
# Steps are in docs/deploy-backend.md.
services:
  - type: web
    name: grove-api
    runtime: python
    rootDir: grove-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DB_NAME
        value: grove_db
      # Turns on the production checks: the server refuses to start without the JWT secrets or with CORS_ORIGINS
      # left as '*', and reset or confirmation links are never written to the log.
      - key: APP_ENV
        value: production
      # Secrets: Render asks for these when the Blueprint is created.
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # The app's public address, used in password-reset and confirmation links (without it they point at localhost).
      - key: APP_BASE_URL
        sync: false
      # Random values generated by Render. The code has no built-in default: with APP_ENV=production it refuses to
      # start without them. Never remove them.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

# Render Blueprint for the Grove API (grove-backend). The frontend and landing page deploy on Vercel.
# Steps are in docs/deploy-backend.md.
services:
  - type: web
    name: grove-api
    runtime: python
    rootDir: grove-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DB_NAME
        value: grove_db
      # Secrets: Render asks for these when the Blueprint is created.
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Random values generated by Render. The code has a built-in fallback for these, so never leave them unset.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FloraGrove, herbarium strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&amp;family=Cormorant+Garamond:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F08}
a{color:#C3D98A}a:hover{color:#F4F1E6}
input::placeholder{color:#8E9878}
input:focus{outline:none}
form:focus-within{box-shadow:0 0 0 2px #92B44B}
@keyframes strip{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.track{animation:strip 80s linear infinite}
.strip:hover .track{animation-play-state:paused}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) .2s both}
.r2{animation-delay:.35s}.r3{animation-delay:.5s}
@media (prefers-reduced-motion: reduce){.track,.rise{animation:none}}
</style>
</helmet>
<main style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #0B0F08; color: #F4F1E6; font-family: 'Alegreya Sans', Optima, Candara, sans-serif">
  <header style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 24px clamp(20px, 4vw, 40px)">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="white-space:nowrap;line-height:1;color:inherit" aria-label="FloraGrove"><span style="font-family:'Alegreya Sans',Optima,Candara,sans-serif;font-weight:300;font-size:22px">Flora</span><span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:25px">Gro<svg viewBox="0 0 32 30" style="display:inline-block;width:0.6em;height:0.56em;vertical-align:-0.03em;margin:0 -0.01em" aria-hidden="true"><path transform="translate(10.5 15) rotate(-24)" d="M0 -14.0 C6.5 -7.0 6.5 7.0 0 14.0 C-6.5 7.0 -6.5 -7.0 0 -14.0Z" fill="none" stroke="#92B44B" stroke-width="2.6"/><path transform="translate(21.5 15) rotate(24)" d="M0 -14.0 C6.5 -7.0 6.5 7.0 0 14.0 C-6.5 7.0 -6.5 -7.0 0 -14.0Z" fill="#92B44B"/></svg>e</span></span>
    </div>
    <div style="font-size: 14px; color: #A9B09A">iPhone · December</div>
  </header>

  <div class="strip" aria-hidden="true" style="overflow: hidden; width: 100%">
    <div class="track" style="display: flex; width: max-content">
      <sc-for list="{{strip}}" as="p" hint-placeholder-count="11">
        <img src="{{p.src}}" alt="" style="display: block; height: clamp(150px, 24vh, 230px); width: auto; margin-right: 8px">
      </sc-for>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 48px 24px 48px; text-align: center">
    <h1 class="rise" style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(28px, 2.6vw, 36px); line-height: 1.22; max-width: 24ch; text-wrap: balance">You don't need a green thumb. You need to know what your plant needs today.</h1>

    <div class="rise r2" style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%">
      <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{submit}}" novalidate style="display: flex; align-items: center; width: 100%; max-width: 400px; box-sizing: border-box; padding: 4px 4px 4px 18px; border-radius: 16px; background: #1C2416; border: 1px solid {{wellBorder}}">
          <label for="email-s1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Email address</label>
          <input id="email-s1" type="email" autocomplete="email" placeholder="Your email address" value="{{email}}" onInput="{{onEmail}}" style="flex: 1 1 auto; min-width: 0; height: 48px; border: 0; background: transparent; color: #F4F1E6; font-family: inherit; font-size: 16px">
          <button type="submit" style="flex: 0 0 auto; height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #F4F1E6; color: #0B0F08; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Join the waitlist</button>
        </form>
        <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="font-size: 15px; color: #E57A9C">That email doesn't look quite right.</div>
        </sc-if>
      </sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 18px; line-height: 1.45">
          <div>You're on the list. We'll write to <strong style="font-weight: 700">{{email}}</strong> in December.</div>
          <button type="button" onClick="{{toggleBeta}}" aria-pressed="{{betaPressed}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #C3D98A; font-family: inherit; font-size: 16px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">{{betaLabel}}</button>
        </div>
      </sc-if>
    </div>

    <div class="rise r3" style="font-size: 14px; line-height: 1.5; color: #A9B09A">Illustrations from FloraGrove's plant library. Coming to iPhone this December.</div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', done: false, error: false, beta: false };
  }
  renderVals() {
    const s = this.state;
    const plates = [
      '/_blob/cfa430dfb8ec193158c052c79e227b56',
      '/_blob/0b76cdae406a8c4968027edfd89109ef',
      '/_blob/65abdbdd9312e6eccbb1771ba0e7c0a8',
      '/_blob/59192f95af3e411fac35e5f94be17c4e',
      '/_blob/9afd240831b3df34808c72da340013f4',
      '/_blob/e23f3026763551fc556fd5d0dff1d7f7',
      '/_blob/1789b872a3aafde35e26c576e4205a13',
      '/_blob/335fea500fac0f88b60e6e1119106b44',
      '/_blob/c769110fc79bfab0077a0a9c9b477ed3',
      '/_blob/034f41debbab62ae7a32103a645a77e3',
      '/_blob/027e6e68a73d04d1da249e142a8ccd9e'
    ];
    return {
      strip: plates.concat(plates).map((src) => ({ src: src })),
      email: s.email,
      showForm: !s.done,
      done: s.done,
      hasError: s.error,
      wellBorder: s.error ? '#E57A9C' : '#2D3B1A',
      onEmail: (e) => this.setState({ email: e.target.value, error: false }),
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email.trim());
        this.setState(ok ? { done: true, error: false } : { error: true });
      },
      betaPressed: s.beta ? 'true' : 'false',
      betaLabel: s.beta ? 'We’ll invite you to test early. Tap to undo.' : 'Want to test FloraGrove before launch?',
      toggleBeta: () => this.setState({ beta: !s.beta })
    };
  }
}
</script>
</body>
</html>
